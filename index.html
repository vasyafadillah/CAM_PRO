<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAM PRO — penjernih foto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceae6;--panel:#fbfaf8;--ink:#1c1c1e;--mut:#6a6a70;--line:#d6d3cd;--red:#d3241b;--stage:#dedbd5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161719;--panel:#1f2124;--ink:#ecebe8;--mut:#9b9ba1;--line:#32343a;--stage:#101113;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161719;--panel:#1f2124;--ink:#ecebe8;--mut:#9b9ba1;--line:#32343a;--stage:#101113;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 18px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--red);flex:none}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
header span{color:var(--mut);font-size:13px}
main{display:grid;gap:14px;padding:0 14px 28px;max-width:1180px;margin:0 auto}
@media(min-width:880px){main{grid-template-columns:1fr 340px;align-items:start}}
.stage{background:var(--stage);border-radius:10px;min-height:300px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
canvas{display:none;max-width:100%;max-height:68vh;width:auto;height:auto}
.empty{text-align:center;padding:36px 22px;max-width:360px}
.empty p{color:var(--mut);margin:10px 0 0;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px 20px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -2px 6px}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;background:transparent}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--red)}
.row{display:grid;grid-template-columns:1fr auto;column-gap:10px;margin:9px 0 0}
.row label{font-size:13.5px}
.row output{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.row input{grid-column:1/3;width:100%;margin:4px 0 0;accent-color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.note{color:var(--mut);font-size:12.5px;margin:12px 0 0}
#st{position:absolute;top:10px;left:12px;font-size:12.5px;color:var(--mut)}
.hold{position:absolute;bottom:10px;right:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
.chips{flex-wrap:wrap;overflow:visible}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:12px}
.tab{border:0;background:transparent;border-radius:7px;padding:8px 4px;font-size:13.5px;color:var(--mut)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body>
<header><span class="dot"></span><h1>CAM PRO</h1><span>penjernih foto</span><span style="margin-left:auto">oleh @Vasya_Project</span></header>
<main>
  <section class="stage" id="stage">
    <div class="empty" id="empty">
      <button class="btn" id="pick">Pilih foto</button>
      <p>Foto diproses di perangkatmu dan tidak diunggah ke mana pun.</p>
    </div>
    <canvas id="cv" aria-label="Pratinjau foto"></canvas>
    <div id="st"></div>
    <button class="hold" id="hold">Tahan untuk lihat asli</button>
  </section>
  <aside class="panel">
    <nav class="menu" role="tablist" aria-label="Menu"><button class="tab" role="tab" data-t="l">Look</button><button class="tab" role="tab" data-t="c">Cahaya</button><button class="tab" role="tab" data-t="d">Detail</button><button class="tab" role="tab" data-t="w">Warna</button></nav>
    <div class="chips" id="chips" role="group" aria-label="Look"></div>
    <div id="sl"></div>
    <div class="actions">
      <button class="btn" id="save" disabled>Simpan foto</button>
      <button class="btn ghost" id="reset" disabled>Atur ulang</button>
      <button class="btn ghost" id="again">Ganti foto</button>
    </div>
    <p class="note" id="dlnote"></p>
    <p class="note">Web ini didukung untuk memperjernihkan yang diunggah hasil foto, dan didukung oleh Look Leica, Sony, iPhone, IMAX, supaya menghasilkan gambar, dihasilkan oleh device dukungan tersebut.</p>
  </aside>
</main>
<input type="file" id="file" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s);
const SL=[['exp','Kecerahan',-100,100],['con','Kontras',-100,100],['clar','Kejernihan',0,100],['sharp','Ketajaman',0,100],['sat','Saturasi',-100,100],['temp','Suhu warna',-100,100],['tint','Nuansa teal dan hangat',0,100],['fade','Matte',0,100],['vig','Vignette',0,100],['grain','Grain film',0,100]];
const PR=[['Asli',{}],['Otomatis',null],['Jernihkan',{shad:25,high:-20,clar:40,sharp:50,con:8,sat:10}],['Leica',{exp:-2,con:24,shad:-14,high:-20,sat:4,temp:5,tint:40,clar:30,sharp:34,vig:22,grain:12}],['Leica mono',{con:30,shad:-15,high:-12,sat:-100,clar:32,sharp:34,vig:30,grain:22}],['Sony',{exp:4,con:12,shad:14,high:-14,sat:12,temp:2,clar:16,sharp:44}],['Sony cine',{exp:2,con:-4,shad:20,high:-20,sat:4,temp:5,fade:10,clar:8,sharp:30,grain:4}],['iPhone cam',{exp:6,con:16,shad:16,high:-18,sat:14,temp:2,clar:24,sharp:40}],['iPhone 18 film',{exp:3,con:10,shad:10,high:-12,sat:6,temp:6,fade:6,clar:12,sharp:28,grain:16}],['iPhone vivid',{exp:6,con:16,shad:24,high:-22,sat:30,temp:2,fade:2,clar:28,sharp:40}],['IMAX',{exp:0,con:18,shad:6,high:-16,sat:14,temp:-2,clar:36,sharp:46,vig:6,grain:6}]];
const GR={exp:'c',con:'c',shad:'c',high:'c',fade:'c',vig:'c',clar:'d',sharp:'d',grain:'d',sat:'w',temp:'w',tint:'w'};
const V={};let W=0,H=0,S,Bs,Bl,out,cur='Asli',DL=null,raf=0;
const cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});

SL.splice(2,0,['shad','Bayangan',-100,100],['high','Highlight',-100,100]);
SL.forEach(([k,l,a,b])=>{V[k]=0;const d=document.createElement('div');d.className='row';d.dataset.g=GR[k];
 d.innerHTML=`<label for="s_${k}">${l}</label><output id="o_${k}">0</output><input type="range" id="s_${k}" min="${a}" max="${b}" value="0">`;
 $('#sl').appendChild(d);
 d.querySelector('input').addEventListener('input',e=>{V[k]=+e.target.value;$('#o_'+k).textContent=V[k];setChip('');queue()});});
PR.forEach(([n,v])=>{const c=document.createElement('button');c.className='chip';c.dataset.n=n;c.setAttribute('aria-pressed','false');c.innerHTML='<i></i>'+n;
 c.onclick=()=>{apply(v||autoV());setChip(n)};$('#chips').appendChild(c)});
function setChip(n){cur=n;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.n===n))}
function apply(v){SL.forEach(([k,,a])=>{V[k]=v[k]||0;$('#s_'+k).value=V[k];$('#o_'+k).textContent=V[k]});queue()}
setChip('Asli');
function tab(t){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));$('#chips').style.display=t==='l'?'flex':'none';document.querySelectorAll('.row').forEach(r=>r.style.display=r.dataset.g===t?'grid':'none')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));tab('l');
$('#reset').onclick=()=>{apply({});setChip('Asli')};

function hb(i,o,w,h,r){const d=2*r+1;for(let y=0;y<h;y++){const q=y*w;for(let c=0;c<3;c++){let s=0;for(let x=-r;x<=r;x++)s+=i[(q+Math.min(w-1,Math.max(0,x)))*4+c];for(let x=0;x<w;x++){o[(q+x)*4+c]=s/d;s+=i[(q+Math.min(w-1,x+r+1))*4+c]-i[(q+Math.max(0,x-r))*4+c]}}}}
function vb(i,o,w,h,r){const d=2*r+1;for(let x=0;x<w;x++){for(let c=0;c<3;c++){let s=0;for(let y=-r;y<=r;y++)s+=i[(Math.min(h-1,Math.max(0,y))*w+x)*4+c];for(let y=0;y<h;y++){o[(y*w+x)*4+c]=s/d;s+=i[(Math.min(h-1,y+r+1)*w+x)*4+c]-i[(Math.max(0,y-r)*w+x)*4+c]}}}}
function blur(s,r){const a=new Uint8ClampedArray(s),b=new Uint8ClampedArray(s);for(let k=0;k<2;k++){hb(a,b,W,H,r);vb(b,a,W,H,r)}return a}

$('#pick').onclick=$('#again').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 $('#st').textContent='Membuka foto…';
 try{
  const bm=await createImageBitmap(f,{imageOrientation:'from-image'});
  const sc=Math.min(1,2000/Math.max(bm.width,bm.height));
  W=Math.round(bm.width*sc);H=Math.round(bm.height*sc);cv.width=W;cv.height=H;
  ctx.drawImage(bm,0,0,W,H);S=ctx.getImageData(0,0,W,H).data;out=ctx.createImageData(W,H);
  $('#empty').style.display='none';cv.style.display='block';$('#hold').style.display='block';
  $('#st').textContent='Menganalisis detail…';
  setTimeout(()=>{Bs=blur(S,2);Bl=blur(S,Math.max(8,Math.round(Math.max(W,H)/45)));$('#st').textContent='';
   $('#save').disabled=false;$('#reset').disabled=false;apply(autoV());setChip('Otomatis')},30);
 }catch(err){$('#st').textContent='Foto tidak bisa dibuka. Coba format JPG atau PNG.'}
 e.target.value='';};

function queue(){if(!W||!Bl||raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function render(){
 const o=out.data,n=W*H*4;
 const ex=Math.pow(2,V.exp/100*.9),cn=V.con/100*2.2,sa=1+V.sat/100,tp=V.temp/100*.09,tn=V.tint/100,fd=V.fade/100*.14,sd=V.shad/100*.9,hg=V.high/100*.35,cl=V.clar/100*1.3,sh=V.sharp/100*1.5,vg=V.vig/100*.6,gr=V.grain/100*.09;
 const cx=W/2,cy=H/2,rm=cx*cx+cy*cy;
 const lm=d=>d>45?45:d<-45?-45:d;const cu=x=>{x=x<0?0:x>1?1:x;return x+cn*(x*x*(3-2*x)-x)};
 let x=0,y=0;
 for(let i=0,p=0;i<n;i+=4,p++){
  let r=S[i],g=S[i+1],b=S[i+2];
  const l0=(r*.299+g*.587+b*.114)/255,mm=Math.max(.2,1-Math.abs(l0-.5)*1.7);
  r+=lm((r-Bs[i])*sh)+lm((r-Bl[i])*cl*mm);g+=lm((g-Bs[i+1])*sh)+lm((g-Bl[i+1])*cl*mm);b+=lm((b-Bs[i+2])*sh)+lm((b-Bl[i+2])*cl*mm);
  r=cu(r/255*ex)+tp;g=cu(g/255*ex);b=cu(b/255*ex)-tp;
  {const q=.299*r+.587*g+.114*b,k=(1+sd*(1-q)*(1-q))*(1+hg*q*q);r*=k;g*=k;b*=k}
  let l=.299*r+.587*g+.114*b;
  r=l+(r-l)*sa;g=l+(g-l)*sa;b=l+(b-l)*sa;
  l=.299*r+.587*g+.114*b;
  const sw=(1-l)*(1-l),hw=l*l;
  r+=tn*(-.02*sw+.025*hw);g+=tn*(.028*sw+.008*hw);b+=tn*(.045*sw-.03*hw);
  r=fd+r*(1-fd);g=fd+g*(1-fd);b=fd+b*(1-fd);
  if(vg){const dx=x-cx,dy=y-cy,f=1-vg*Math.pow((dx*dx+dy*dy)/rm,1.4);r*=f;g*=f;b*=f}
  if(gr){const z=((Math.imul(p,2654435761)>>>24)/255-.5)*gr*(1-Math.abs(l-.5)*1.2);r+=z;g+=z;b+=z}
  o[i]=r*255;o[i+1]=g*255;o[i+2]=b*255;o[i+3]=255;
  if(++x===W){x=0;y++}
 }
 ctx.putImageData(out,0,0);
}
function autoV(){const h=new Uint32Array(256);let n=0,sr=0,sb=0;for(let i=0;i<S.length;i+=16){h[(S[i]*.299+S[i+1]*.587+S[i+2]*.114)|0]++;n++;sr+=S[i];sb+=S[i+2]}
 const pc=p=>{let c=0;for(let k=0;k<256;k++){c+=h[k];if(c>=n*p)return k/255}return 1};
 const cf=t=>{let c=0;for(let k=0;k<t*255;k++)c+=h[k];return c/n};
 const cl=(x,a,b)=>x<a?a:x>b?b:x;
 let m=0;for(let k=0;k<256;k++)m+=h[k]*k;m=Math.max(.05,m/n/255);
 const e=cl(Math.log2(Math.pow(.46/m,.6))/.9*100,-25,35),fs=cf(.2),fh=1-cf(.85),sp=pc(.95)-pc(.05);
 return{exp:Math.round(e),shad:Math.round(cl(fs*180,12,75)),high:-Math.round(cl(fh*220,8,60)),con:Math.round(cl((.62-sp)*90+8,4,30)),sat:16,clar:38,sharp:40,temp:Math.round(cl((sb-sr)/n*.5,-12,12))}}
const hold=$('#hold');
hold.addEventListener('pointerdown',e=>{hold.setPointerCapture(e.pointerId);ctx.putImageData(new ImageData(new Uint8ClampedArray(S),W,H),0,0)});
['pointerup','pointercancel'].forEach(t=>hold.addEventListener(t,()=>render()));

(async()=>{try{DL=window.claude&&await claude.use('downloads')}catch(e){DL=null}
 if(!DL)$('#dlnote').textContent='Tap Simpan foto, lalu tekan lama gambar yang muncul untuk menyimpan.'})();
function showImg(){render();const u=cv.toDataURL('image/jpeg',.95),o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px';o.innerHTML='<img alt="Hasil foto" style="max-width:100%;max-height:72vh;border-radius:8px"><p style="color:#fff;margin:0;text-align:center;font-size:14px">Tekan lama gambar, lalu pilih Simpan gambar.</p><button class="btn">Tutup</button>';o.querySelector('img').src=u;o.querySelector('button').onclick=()=>o.remove();document.body.appendChild(o)}
function autoDl(){render();const a=document.createElement('a');a.download='campro-'+(cur||'edit').toLowerCase().replace(/\s+/g,'-')+'.jpg';a.href=cv.toDataURL('image/jpeg',.95);document.body.appendChild(a);a.click();a.remove();$('#dlnote').innerHTML='Foto dikirim ke unduhan. Tidak muncul? <button class="btn ghost" id="shw" style="padding:6px 12px;margin-left:4px">Tampilkan gambar</button>';$('#shw').onclick=showImg}
$('#save').onclick=()=>{render();
 cv.toBlob(async b=>{
  if(DL){try{await DL.save({filename:'campro-'+(cur||'edit').toLowerCase().replace(/\s+/g,'-')+'.jpg',data:b})}catch(e){if(e&&e.code!=='declined')showImg()}}
  else autoDl()
 },'image/jpeg',.95)};
</script>
</body>
</html>
